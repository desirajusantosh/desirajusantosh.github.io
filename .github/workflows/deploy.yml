name: Build and deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# master and main both deploy to gh-pages; queue runs so their pushes don't race
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.112.5'
          extended: true

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('content/**/*.jpg', 'content/**/*.JPG', 'content/**/*.jpeg', 'content/**/*.png', 'layouts/**') }}
          restore-keys: hugo-resources-

      - name: Build site
        run: |
          hugo -d public --gc --minify --baseURL "https://desirajusantosh.github.io/"

      - name: Ensure .nojekyll
        run: touch public/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          publish_dir: ./public
          allow_empty_commit: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Tell Bing (and DuckDuckGo, Yahoo, ChatGPT search, which use its index) which pages exist.
      # Google doesn't support IndexNow; it uses the sitemap submitted in Search Console.
      - name: Ping IndexNow
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          INDEXNOW_KEY: 9d226f5430700dbfc29c6cec0fdb2900   # also published at static/9d226f5430700dbfc29c6cec0fdb2900.txt
        run: |
          sleep 60   # give GitHub Pages a minute to publish the new build
          URLS=$(grep -o '<loc>[^<]*' public/sitemap.xml | sed 's/<loc>//' | grep -v '/tags/' | jq -R . | jq -sc .)
          BODY=$(jq -nc --arg key "$INDEXNOW_KEY" --argjson urls "$URLS" '{host: "desirajusantosh.github.io", key: $key, keyLocation: ("https://desirajusantosh.github.io/" + $key + ".txt"), urlList: $urls}')
          curl -s -o /dev/null -w "IndexNow: HTTP %{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
