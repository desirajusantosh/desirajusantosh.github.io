<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" role="img" aria-label="Two processes run the house: Node for the screens, Python for the devices" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <rect width="760" height="472" fill="#ffffff"/>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2937">Two processes run the house: Node for the screens, Python for the devices</text>
  <text x="24" y="54" font-size="11.5" fill="#6b7280">Arrows point from the caller to what it calls</text>

  <rect x="16" y="160" width="496" height="232" rx="12" fill="none" stroke="#9aa0a6" stroke-dasharray="5 4"/>
  <text x="24" y="416" font-size="11.5" fill="#6b7280">Dashed box: a watchdog restarts either process if it crashes or hangs</text>

  <g fill="none" stroke="#9aa0a6" stroke-width="1.25">
    <path d="M104 132V176" marker-end="url(#arch-arrow)"/>
    <path d="M264 132V176" marker-end="url(#arch-arrow)"/>
    <path d="M424 132V176" marker-end="url(#arch-arrow)"/>
    <path d="M496 212H544" marker-end="url(#arch-arrow)"/>
    <path d="M264 248V304" marker-end="url(#arch-arrow)"/>
    <path d="M496 332H544" marker-end="url(#arch-arrow)"/>
    <path d="M496 364H520V412H544" marker-end="url(#arch-arrow)"/>
  </g>

  <g fill="none" stroke="#9aa0a6" stroke-width="1.25">
    <rect x="32" y="76" width="144" height="56" rx="8"/>
    <rect x="192" y="76" width="144" height="56" rx="8"/>
    <rect x="352" y="76" width="144" height="56" rx="8"/>
    <rect x="32" y="304" width="464" height="72" rx="8"/>
    <rect x="544" y="176" width="192" height="72" rx="8"/>
    <rect x="544" y="304" width="192" height="56" rx="8"/>
    <rect x="544" y="376" width="192" height="72" rx="8"/>
  </g>
  <rect x="32" y="176" width="464" height="72" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="104" y="100" font-weight="600" fill="#1f2937">Fire tablet</text>
    <text x="104" y="116" font-size="11.5" fill="#6b7280">home Wi-Fi + PIN</text>
    <text x="264" y="100" font-weight="600" fill="#1f2937">Phone</text>
    <text x="264" y="116" font-size="11.5" fill="#6b7280">via Tailscale</text>
    <text x="424" y="100" font-weight="600" fill="#1f2937">Laptop</text>
    <text x="424" y="116" font-size="11.5" fill="#6b7280">on the hub itself</text>
  </g>

  <text x="48" y="200" font-weight="600" fill="#1f2937">Node server (the hub)</text>
  <text x="48" y="216" font-size="11.5" fill="#1f2937">Serves the dashboard; PIN, health checks, history in SQLite, backups</text>
  <text x="48" y="232" font-size="11.5" fill="#1f2937">Calls Ring and TomTom traffic directly</text>

  <text x="272" y="280" font-size="11.5" fill="#6b7280">polls every 5 s</text>

  <text x="48" y="328" font-weight="600" fill="#1f2937">Python bridge</text>
  <text x="48" y="344" font-size="11.5" fill="#1f2937">Runs the device libraries that only exist in Python</text>
  <text x="48" y="360" font-size="11.5" fill="#1f2937">Cync, Lennox, Cast, Roborock, Sunrun, plugs, garage</text>

  <text x="560" y="200" font-weight="600" fill="#1f2937">Clouds Node calls</text>
  <text x="560" y="216" font-size="11.5" fill="#1f2937">Ring cameras</text>
  <text x="560" y="232" font-size="11.5" fill="#1f2937">TomTom traffic</text>

  <text x="560" y="328" font-weight="600" fill="#1f2937">Device clouds</text>
  <text x="560" y="344" font-size="11.5" fill="#1f2937">Cync, Lennox, Sunrun</text>

  <text x="560" y="400" font-weight="600" fill="#1f2937">On home Wi-Fi</text>
  <text x="560" y="416" font-size="11.5" fill="#1f2937">Google TV, speakers,</text>
  <text x="560" y="432" font-size="11.5" fill="#1f2937">Roborock, plugs, garage</text>
</svg>
